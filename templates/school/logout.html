{% extends 'school/base.html' %}

{% block title %}School Admin Logout{% endblock %}

{% block standalone_content %}
<div class="modal-overlay">
    <div class="modal-content glass-panel" style="border-top: 4px solid var(--color-danger); max-width: 450px;">
        <i class="fa-solid fa-right-from-bracket" style="font-size: 3rem; color: var(--color-danger); margin-bottom: 20px;"></i>
        <h2 class="modal-title">LOG OUT ?</h2>
        <p class="modal-description" style="line-height: 1.6;">Please Confirm You are about to close all pages and logout from Foundry.</p>
        
        <form method="POST" action="{% url 'school_logout' %}">
            {% csrf_token %}
            <div class="modal-actions">
                <button type="submit" name="action" value="no" class="btn btn-secondary">
                    No
                </button>
                <button type="submit" name="action" value="yes" class="btn btn-danger" style="padding: 10px 25px;">
                    Yes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
